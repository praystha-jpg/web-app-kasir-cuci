<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Bubbles & Sparkles -->
  <circle cx="150" cy="140" r="28" fill="url(#bubbleGrad)" filter="url(#glow)" />
  <circle cx="190" cy="110" r="16" fill="url(#bubbleGrad)" />
  <circle cx="340" cy="130" r="22" fill="url(#bubbleGrad)" filter="url(#glow)" />
  <circle cx="370" cy="170" r="14" fill="url(#bubbleGrad)" />

  <!-- Sparkle stars -->
  <path d="M 330 90 Q 330 110 350 110 Q 330 110 330 130 Q 330 110 310 110 Q 330 110 330 90 Z" fill="#ffffff" />
  <path d="M 130 190 Q 130 205 145 205 Q 130 205 130 220 Q 130 205 115 205 Q 130 205 130 190 Z" fill="#93c5fd" />

  <!-- Car Silhouette / Modern Graphic -->
  <g transform="translate(76, 175) scale(0.7)">
    <!-- Car Body -->
    <path d="M 60 210 
             L 90 120 
             Q 110 70 180 65 
             L 340 65 
             Q 410 70 430 120 
             L 460 210 
             Q 490 220 500 250 
             L 500 310 
             Q 500 330 470 330 
             L 450 330 
             Q 440 260 370 260 
             Q 300 260 290 330 
             L 230 330 
             Q 220 260 150 260 
             Q 80 260 70 330 
             L 40 330 
             Q 15 330 15 300 
             L 20 250 
             Q 30 220 60 210 Z" 
          fill="#ffffff" />

    <!-- Windshield & Windows -->
    <path d="M 115 130 
             L 135 85 
             Q 145 80 180 80 
             L 245 80 
             L 245 130 Z" 
          fill="#1e3a8a" />
    <path d="M 270 80 
             L 340 80 
             Q 370 80 380 90 
             L 405 130 
             L 270 130 Z" 
          fill="#1e3a8a" />

    <!-- Headlight & Taillight -->
    <path d="M 30 240 L 65 240 L 60 265 L 25 260 Z" fill="#f59e0b" rx="4" />
    <path d="M 460 240 L 495 245 L 490 270 L 455 265 Z" fill="#ef4444" rx="4" />

    <!-- Wheels -->
    <!-- Wheel Left -->
    <circle cx="150" cy="330" r="55" fill="#0f172a" stroke="#ffffff" stroke-width="12" />
    <circle cx="150" cy="330" r="25" fill="#94a3b8" />
    <circle cx="150" cy="330" r="10" fill="#ffffff" />

    <!-- Wheel Right -->
    <circle cx="370" cy="330" r="55" fill="#0f172a" stroke="#ffffff" stroke-width="12" />
    <circle cx="370" cy="330" r="25" fill="#94a3b8" />
    <circle cx="370" cy="330" r="10" fill="#ffffff" />
  </g>

  <!-- Water Stream / Shine Arc -->
  <path d="M 80 430 Q 256 465 432 430" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <path d="M 130 455 Q 256 480 382 455" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.7" />
</svg>
